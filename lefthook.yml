pre-commit:
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      exclude: "**/template-generator/templates/**"
      run: pnpm exec oxlint --fix --deny-warnings {staged_files}
    format:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,yml,yaml}"
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true
