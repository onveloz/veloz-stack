name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: types + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build embedded template map
        run: pnpm --filter @veloz-stack/template-generator gen

      - name: Type-check all workspaces
        run: pnpm -r --parallel check-types

      - name: Unit tests (template-generator)
        run: pnpm --filter @veloz-stack/template-generator test

  e2e:
    name: e2e · ${{ matrix.combo.name }}
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        combo:
          # ─────── Presets & baselines
          - { name: default, args: "" }
          - { name: minimal, args: "--preset minimal" }
          - { name: no-addons, args: "--addons ''" }

          # ─────── Frontend axis
          - { name: frontend-tanstack, args: "--frontend tanstack-start" }
          - { name: frontend-next, args: "--frontend next" }
          - { name: frontend-astro, args: "--frontend astro" }
          - { name: frontend-nuxt, args: "--frontend nuxt" }
          - { name: frontend-svelte, args: "--frontend svelte-kit" }
          - { name: frontend-none, args: "--frontend none" }

          # ─────── Mobile axis (independent — coexists with web frontend)
          - { name: mobile-expo, args: "--mobile expo" }
          - { name: mobile-only, args: "--frontend none --mobile expo" }

          # ─────── Desktop axis (Tauri wraps the web frontend)
          - { name: desktop-tauri, args: "--desktop tauri" }
          - { name: desktop-tauri-next, args: "--frontend next --desktop tauri" }

          # ─────── UI axis
          - { name: ui-shadcn-tanstack, args: "--frontend tanstack-start --ui shadcn" }
          - { name: ui-shadcn-next, args: "--frontend next --ui shadcn" }
          - { name: ui-tailwind, args: "--ui tailwind" }
          - { name: ui-none-tanstack, args: "--frontend tanstack-start --ui none" }
          - { name: ui-none-next, args: "--frontend next --ui none" }

          # Auto-fallback: nuxt with default ui=shadcn must succeed
          # (CLI silently falls back to tailwind for non-React)
          - { name: ui-fallback-nuxt, args: "--frontend nuxt" }
          - { name: ui-fallback-svelte, args: "--frontend svelte-kit" }

          # ─────── Runtime axis
          - { name: runtime-bun, args: "--runtime bun" }
          - { name: runtime-node, args: "--runtime node" }

          # ─────── ORM axis
          - { name: orm-drizzle, args: "--orm drizzle" }
          - { name: orm-prisma, args: "--orm prisma" }

          # ─────── Auth axis
          - { name: auth-better, args: "--auth better-auth" }
          - { name: auth-none, args: "--auth none" }

          # ─────── DB axis
          - { name: db-postgres, args: "--db postgres --db-hosting veloz" }
          - { name: db-sqlite, args: "--db sqlite --db-hosting turso" }
          - { name: db-none, args: "--db none --orm none --db-hosting none --auth none" }

          # ─────── Deploy axis
          - { name: deploy-veloz, args: "--deploy veloz" }
          - { name: deploy-vercel, args: "--deploy vercel" }
          - { name: deploy-fly, args: "--deploy fly" }
          - { name: deploy-render, args: "--deploy render" }
          - { name: deploy-docker, args: "--deploy docker" }
          - { name: deploy-cloudflare, args: "--deploy cloudflare --runtime workers" }
          - { name: deploy-none, args: "--deploy none" }

          # ─────── Package manager axis
          - { name: pm-pnpm, args: "--pm pnpm" }
          - { name: pm-bun, args: "--pm bun" }

          # ─────── Modules & examples
          - { name: modules-br-bundle, args: "--modules claude,abacatepay,ararahq-sms,resend,pt-br-i18n,cpf-cnpj,himetrica" }
          - { name: modules-international, args: "--modules claude,stripe-br,posthog,sentry" }
          - { name: modules-empty, args: "--modules ''" }
          - { name: examples-todo, args: "--examples todo" }
          - { name: examples-pix, args: "--examples pix-checkout --modules claude,abacatepay" }

          # ─────── Payment combos — every BR payment vendor
          - { name: payments-all-br, args: "--modules claude,abacatepay,asaas,pagarme,mercadopago,stripe-br" }

          # ─────── Addons axis
          - { name: addons-turborepo-only, args: "--addons turborepo" }
          - { name: addons-biome-only, args: "--addons biome" }
          - { name: addons-husky, args: "--addons husky,biome" }
          - { name: addons-lefthook, args: "--addons lefthook,biome" }
          - { name: addons-lefthook-ci, args: "--addons lefthook,biome --lefthook-ci" }
          - { name: addons-lefthook-advanced, args: "--addons lefthook,biome,turborepo --lefthook-advanced" }
          - { name: addons-all, args: "--addons turborepo,biome,husky" }
          - { name: addons-oxlint, args: "--addons turborepo,oxlint" }
          - { name: addons-oxlint-strict, args: "--addons turborepo,oxlint --oxlint-strict" }
          - { name: module-pino, args: "--preset minimal --runtime node --modules pino" }
          - {
              name: module-opentelemetry,
              args: "--preset minimal --runtime node --modules opentelemetry",
            }
          - { name: module-next-intl, args: "--frontend next --modules next-intl" }

          # ─────── Cross-cutting combos
          - { name: prisma-next, args: "--orm prisma --frontend next" }
          - { name: prisma-todo, args: "--orm prisma --examples todo" }
          - { name: astro-pnpm-drizzle, args: "--frontend astro --pm pnpm --orm drizzle" }
          - { name: node-vercel-next, args: "--runtime node --deploy vercel --frontend next" }
          - { name: triple-platform, args: "--frontend tanstack-start --mobile expo --desktop tauri" }
          - { name: shadcn-tauri-next, args: "--frontend next --ui shadcn --desktop tauri" }

          # ─────── Known-invalid guard (the CLI should exit non-zero)
          # Handled separately in the invalid-combos job below.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - name: Scaffold + install + typecheck
        env:
          COMBO_ARGS: ${{ matrix.combo.args }}
        run: |
          bash scripts/e2e-combo.sh "${{ matrix.combo.name }}" $COMBO_ARGS

  invalid-combos:
    name: invalid combos rejected
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Workers runtime + Express backend must be rejected
        run: |
          set +e
          ./apps/cli/node_modules/.bin/tsx apps/cli/src/index.ts \
            /tmp/veloz-invalid --yes --no-install --pm pnpm \
            --runtime workers --backend express
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "::error::Scaffolder accepted an invalid combo"
            exit 1
          fi
          echo "✓ Rejected with exit code $code"

      - name: Better Auth + db:none must be rejected
        run: |
          set +e
          ./apps/cli/node_modules/.bin/tsx apps/cli/src/index.ts \
            /tmp/veloz-invalid2 --yes --no-install --pm pnpm \
            --auth better-auth --db none --orm none --db-hosting none
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "::error::Scaffolder accepted auth=better-auth + db=none"
            exit 1
          fi
          echo "✓ Rejected with exit code $code"

      - name: shadcn UI + non-React frontend must be rejected
        run: |
          set +e
          ./apps/cli/node_modules/.bin/tsx apps/cli/src/index.ts \
            /tmp/veloz-invalid3 --yes --no-install --pm pnpm \
            --frontend nuxt --ui shadcn
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "::error::Scaffolder accepted ui=shadcn + frontend=nuxt"
            exit 1
          fi
          echo "✓ Rejected with exit code $code"

      - name: Biome + oxlint addons together must be rejected
        run: |
          set +e
          ./apps/cli/node_modules/.bin/tsx apps/cli/src/index.ts \
            /tmp/veloz-invalid-biome-oxlint --yes --no-install --pm pnpm \
            --addons turborepo,biome,oxlint
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "::error::Scaffolder accepted biome + oxlint together"
            exit 1
          fi
          echo "✓ Rejected with exit code $code"

      - name: Tauri desktop + frontend=none must be rejected
        run: |
          set +e
          ./apps/cli/node_modules/.bin/tsx apps/cli/src/index.ts \
            /tmp/veloz-invalid4 --yes --no-install --pm pnpm \
            --frontend none --desktop tauri
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "::error::Scaffolder accepted desktop=tauri + frontend=none"
            exit 1
          fi
          echo "✓ Rejected with exit code $code"
